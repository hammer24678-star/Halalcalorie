name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix Android SDK 35 (delete broken jar, reinstall clean)
        run: |
          rm -rf $ANDROID_SDK_ROOT/platforms/android-35
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;34.0.0"
          echo "SDK 35 reinstalled:"
          ls $ANDROID_SDK_ROOT/platforms/android-35/

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Regenerate android folder
        run: |
          rm -rf android
          flutter create --org com.halalcalorie --project-name halalcalorie .

      - name: Patch android config
        run: python3 patch_android.py

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }} \
            --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: halalcalorie-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
