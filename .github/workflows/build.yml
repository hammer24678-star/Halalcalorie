name: Build APK
on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'

      - run: flutter pub get

      - run: flutter create --platforms=android --project-name=halalcalorie .

      - run: python3 patch_android.py

      - run: flutter build apk --release --no-tree-shake-icons
              --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
              --dart-define=RC_GOOGLE_KEY=${{ secrets.RC_GOOGLE_KEY }}

      - name: Release APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: HalalCalorie Latest
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
