name: Build APK & AAB
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: 'stable'

      - run: flutter pub get

      - run: flutter create --platforms=android --project-name=halalcalorie .

      - run: python3 patch_android.py

      - name: Decode keystore
        run: echo "$CM_KEYSTORE" | base64 --decode > android/app/keystore.jks
        env:
          CM_KEYSTORE: ${{ secrets.CM_KEYSTORE }}

      - name: Build APK
        env:
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD:    ${{ secrets.STORE_PASSWORD }}
          KEYSTORE_PATH:        keystore.jks
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          RC_GOOGLE_KEY:        ${{ secrets.RC_GOOGLE_KEY }}
        run: >-
          flutter build apk --release --no-tree-shake-icons
          --dart-define=GROQ_API_KEY=$GROQ_API_KEY
          --dart-define=ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
          --dart-define=RC_GOOGLE_KEY=$RC_GOOGLE_KEY

      - name: Build AAB
        env:
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD:    ${{ secrets.STORE_PASSWORD }}
          KEYSTORE_PATH:        keystore.jks
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          RC_GOOGLE_KEY:        ${{ secrets.RC_GOOGLE_KEY }}
        run: >-
          flutter build appbundle --release --no-tree-shake-icons
          --dart-define=GROQ_API_KEY=$GROQ_API_KEY
          --dart-define=ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
          --dart-define=RC_GOOGLE_KEY=$RC_GOOGLE_KEY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Release APK & AAB
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: HalalCalorie Latest
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
