name: Build APK
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix corrupted Android SDK 35
        run: |
          rm -rf $ANDROID_SDK_ROOT/platforms/android-35
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-35"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable

      - name: Get packages
        run: flutter pub get

      - name: Regenerate android folder
        run: |
          rm -rf android
          flutter create --platforms=android --project-name halalcalorie --org com.halalcalorie .
          flutter pub get

      - name: Patch android config
        run: python3 patch_android.py

      - name: Build APK
        run: |
          flutter build apk --release --no-shrink \
            --dart-define=ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: HalalCalorie-APK
          path: build/app/outputs/flutter-apk/app-release.apk
