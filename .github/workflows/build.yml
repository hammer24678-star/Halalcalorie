name: Build APK & AAB
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'

      - run: flutter pub get

      - run: flutter create --platforms=android --project-name=halalcalorie .

      - run: python3 patch_android.py

      - name: Setup signing
        run: |
          echo "$CM_KEYSTORE" | base64 -d > android/app/keystore.jks
          printf 'storeFile=app/keystore.jks\n' >  android/key.properties
          printf 'storePassword=%s\n' "$CM_KEYSTORE_PASSWORD" >> android/key.properties
          printf 'keyAlias=%s\n'      "$CM_KEY_ALIAS"         >> android/key.properties
          printf 'keyPassword=%s\n'   "$CM_KEY_PASSWORD"      >> android/key.properties
          echo "=== key.properties (masked) ==="
          cat android/key.properties | sed 's/Password=.*/Password=***/'
        env:
          CM_KEYSTORE:          ${{ secrets.CM_KEYSTORE }}
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_PASSWORD:      ${{ secrets.CM_KEY_PASSWORD }}
          CM_KEY_ALIAS:         ${{ secrets.CM_KEY_ALIAS }}

      - name: Build APK
        run: >-
          flutter build apk --release --no-tree-shake-icons
          --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          --dart-define=ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
        env:
          CM_KEY_ALIAS:         ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD:      ${{ secrets.CM_KEY_PASSWORD }}
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          KEYSTORE_PATH: keystore.jks

      - name: Build AAB
        run: >-
          flutter build appbundle --release --no-tree-shake-icons
          --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          --dart-define=ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
        env:
          CM_KEY_ALIAS:         ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD:      ${{ secrets.CM_KEY_PASSWORD }}
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          KEYSTORE_PATH: keystore.jks

      - name: Release APK & AAB
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: HalalCalorie Latest
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
