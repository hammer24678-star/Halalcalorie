format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
  - FLUTTER_VERSION: 3.22.3
  - PROJECT_LOCATION: "."
  - MODULE: app
  - VARIANT: release

workflows:
  primary:
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'

    - git-clone@8: {}

    - flutter-installer@0:
        inputs:
        - version: 3.22.3
        - is_update: "false"

    - restore-dart-cache@1: {}

    - script@1:
        title: Regenerate android folder
        inputs:
        - content: |
            #!/bin/bash
            set -e
            cd $BITRISE_SOURCE_DIR
            rm -rf android
            flutter create --platforms=android --project-name halalcalorie --org com.halalcalorie .
            flutter pub get

    - script@1:
        title: Patch android config
        inputs:
        - content: |
            #!/bin/bash
            set -e
            cd $BITRISE_SOURCE_DIR
            python3 patch_android.py

    - flutter-build@0:
        inputs:
        - project_location: $BITRISE_SOURCE_DIR
        - platform: android
        - android_output_type: apk
        - additional_params: --release --no-shrink --dart-define=ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY

    - save-dart-cache@1: {}

    - deploy-to-bitrise-io@2: {}
