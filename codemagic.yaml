workflows:
  android-release:
    name: HalalCalorie Android Release
    max_build_duration: 60
    environment:
      flutter: 3.22.3
      java: 17
      groups:
        - keystore_credentials
        - app_secrets
    scripts:
      - name: Regenerate android folder
        script: |
          flutter create --platforms=android .

      - name: Patch android config
        script: |
          python3 patch_android.py

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build release APK
        script: |
          flutter build apk --release \
            --dart-define=ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY \
            --no-tree-shake-icons

      - name: Sign APK
        script: |
          APK=$(find build/app/outputs/flutter-apk -name "app-release.apk" | head -1)
          echo "Signing: $APK"
          
          # Decode keystore
          echo "$CM_KEYSTORE" | base64 --decode > /tmp/keystore.jks
          
          # Sign with jarsigner (simpler, no --out issues)
          jarsigner -verbose \
            -keystore /tmp/keystore.jks \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -keypass "$CM_KEY_PASSWORD" \
            -signedjar build/app/outputs/flutter-apk/app-release-signed.apk \
            "$APK" \
            "$CM_KEY_ALIAS"
          
          echo "Signed APK ready"
          ls -lh build/app/outputs/flutter-apk/
