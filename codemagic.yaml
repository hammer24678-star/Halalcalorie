workflows:
  android-release:
    name: HalalCalorie Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.19.6
      groups:
        - keystore_credentials
        - app_secrets
    scripts:
      - name: Get packages
        script: flutter pub get

      - name: Regenerate android folder
        script: |
          rm -rf android
          flutter create --org com.halalcalorie --project-name halalcalorie .

      - name: Patch android config
        script: python3 patch_android.py

      - name: Build APK
        script: |
          flutter build apk --release \
            --dart-define=ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY \
            --no-shrink

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
