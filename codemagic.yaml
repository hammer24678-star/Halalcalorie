workflows:
  android-release:
    name: HalalCalorie Android Release
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      groups:
        - keystore_credentials
        - app_secrets
    scripts:
      - name: Patch and build
        script: |
          flutter pub get

          if [ -f android/app/build.gradle.kts ]; then
            GRADLE_FILE="android/app/build.gradle.kts"
          elif [ -f android/app/build.gradle ]; then
            GRADLE_FILE="android/app/build.gradle"
          else
            echo "ERROR: no gradle file found"; exit 1
          fi

          sed -i 's/minSdk = flutter\.minSdkVersion/minSdk = 21/g' "$GRADLE_FILE"
          sed -i 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 21/g' "$GRADLE_FILE"

          if ! grep -q 'isCoreLibraryDesugaringEnabled' "$GRADLE_FILE"; then
            sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' "$GRADLE_FILE"
          fi

          if ! grep -q 'desugar_jdk_libs' "$GRADLE_FILE"; then
            if grep -q 'dependencies {' "$GRADLE_FILE"; then
              sed -i 's/dependencies {/dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")/' "$GRADLE_FILE"
            else
              printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n' >> "$GRADLE_FILE"
            fi
          fi

          echo "$CM_KEYSTORE" | base64 --decode > /tmp/keystore.jks

          flutter build apk --release --no-shrink \
            --dart-define=ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY \
            --dart-define=CM_KEYSTORE_PATH=/tmp/keystore.jks \
            --dart-define=CM_KEYSTORE_PASSWORD=$CM_KEYSTORE_PASSWORD \
            --dart-define=CM_KEY_ALIAS=$CM_KEY_ALIAS \
            --dart-define=CM_KEY_PASSWORD=$CM_KEY_PASSWORD

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
