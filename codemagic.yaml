workflows:
  android-release:
    name: HalalCalorie Android Release
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      groups:
        - keystore_credentials
        - app_secrets
    scripts:
      - name: Build APK
        script: |
          flutter pub get
          echo "$CM_KEYSTORE" | base64 --decode > /tmp/keystore.jks
          flutter build apk --release --no-shrink \
            --dart-define=ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
