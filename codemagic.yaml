workflows:
  android-release:
    name: Android Release
    max_build_duration: 30
    environment:
      groups:
        - keystore_credentials
        - app_secrets
      flutter: 3.19.6
      java: 17
    scripts:
      - name: Regenerate android folder
        script: |
          flutter create --platforms=android .
          echo "Wrote $(find android -type f | wc -l) files."

      - name: Patch android config
        script: python3 patch_android.py

      - name: Get Flutter packages
        script: flutter pub get

      - name: Reinstall Android SDK 35
        script: |
          SDK=/usr/local/lib/android/sdk
          rm -rf "$SDK/platforms/android-35"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" || \
          yes | "$SDK/tools/bin/sdkmanager" "platforms;android-35" || \
          yes | sdkmanager "platforms;android-35"

      - name: Build release APK
        script: flutter build apk --release --no-tree-shake-icons

      - name: Sign APK
        script: |
          set -e
          APK_IN=build/app/outputs/flutter-apk/app-release.apk
          APK_OUT=build/app/outputs/flutter-apk/app-release-signed.apk

          echo "CM_KEYSTORE length: ${#CM_KEYSTORE}"
          echo "CM_KEY_ALIAS: $CM_KEY_ALIAS"

          if [ -z "$CM_KEYSTORE" ]; then
            echo "WARNING: CM_KEYSTORE is empty — copying unsigned APK as output"
            cp "$APK_IN" "$APK_OUT"
          else
            echo "$CM_KEYSTORE" | base64 --decode > /tmp/keystore.jks
            JKS_SIZE=$(wc -c < /tmp/keystore.jks)
            echo "Decoded keystore size: $JKS_SIZE bytes"

            if [ "$JKS_SIZE" -lt 100 ]; then
              echo "WARNING: keystore too small ($JKS_SIZE bytes) — copying unsigned APK"
              cp "$APK_IN" "$APK_OUT"
            else
              jarsigner \
                -verbose \
                -sigalg SHA256withRSA \
                -digestalg SHA-256 \
                -keystore /tmp/keystore.jks \
                -storepass "$CM_KEYSTORE_PASSWORD" \
                -keypass "$CM_KEY_PASSWORD" \
                -signedjar "$APK_OUT" \
                "$APK_IN" \
                "$CM_KEY_ALIAS"
              echo "Signed successfully."
            fi
          fi

          ls -lh "$APK_OUT"

    artifacts:
      - build/app/outputs/flutter-apk/app-release-signed.apk
      - build/app/outputs/flutter-apk/app-release.apk
